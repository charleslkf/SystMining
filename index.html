<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SYST Mining Game</title>
    <script src="https://cdn-tailwindcss.vercel.app/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Ethers.js for EVM chains -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        :root {
            --bg-dark: #09051c;
            --blue-dark: #1e3a8a;
            --blue-medium: #1d4ed8;
            --blue-light: #60a5fa;
            --fuchsia: #d946ef;
            --cyan: #22d3ee;
            --amber: #f59e0b;
            --text-light: #e3e3e3;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'VT323', monospace;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .pixel-corners {
            background-color: rgba(30, 58, 138, 0.8); /* var(--blue-dark) with opacity */
            border: 4px solid #1e40af;
            backdrop-filter: blur(5px);
        }

        .pixel-btn {
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            border-bottom-width: 4px;
        }
        .pixel-btn:hover { transform: translateY(-2px); }
        .pixel-btn:active { transform: translateY(1px); border-bottom-width: 2px; }
        .pixel-btn:disabled { background-color: #4a5568; border-color: #2d3748; cursor: not-allowed; }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Allow clicks to pass through to the canvas */
        }

        #ui-overlay > * {
             pointer-events: auto; /* Re-enable pointer events for UI elements */
        }

        .modal-overlay {
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="antialiased">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- UI OVERLAY -->
        <div id="ui-overlay" class="p-4 flex flex-col justify-between">
            <!-- Top UI: Wallet Info & Stats -->
            <div class="flex justify-between items-start gap-4">
                <div id="wallet-info" class="pixel-corners p-4 text-lg">
                    <button id="connect-wallet-btn" class="pixel-btn px-4 py-2 bg-amber-500 text-white border-amber-700">Connect Wallet</button>
                    <div id="wallet-details" class="hidden">
                        <p>Status: <span class="text-green-400">Connected</span></p>
                        <p>Wallet: <span id="wallet-address" class="text-cyan-400"></span></p>
                        <p>Node Tier: <span id="node-tier" class="text-fuchsia-400">No Node Detected</span></p>
                    </div>
                </div>
                <div id="game-stats" class="pixel-corners p-4 text-lg text-right hidden">
                    <p>Mined SYST: <span id="syst-balance" class="text-amber-400 text-2xl">0.0000</span></p>
                    <p class="mt-2">Energy:</p>
                    <div class="w-48 h-6 bg-gray-900 border-2 border-cyan-400 mt-1">
                        <div id="energy-bar" class="h-full bg-cyan-400 transition-all duration-300" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom UI: Claim Button -->
            <div class="flex justify-center">
                 <button id="claim-rewards-btn" class="hidden pixel-btn px-8 py-4 text-2xl bg-fuchsia-500 text-white border-fuchsia-700">Claim Rewards</button>
            </div>
        </div>

        <!-- MODAL for initial connection / instructions -->
        <div id="welcome-modal" class="fixed inset-0 modal-overlay z-20 flex items-center justify-center p-4">
            <div class="pixel-corners p-8 max-w-lg text-center">
                <h1 class="text-4xl text-cyan-400 mb-4">SYST Mining Game</h1>
                <p class="text-xl mb-6">Connect your wallet to begin. You must hold a Mining Node NFT to play.</p>
                <button id="modal-connect-btn" class="pixel-btn px-8 py-3 text-2xl bg-amber-500 text-white border-amber-700">Connect Wallet</button>
            </div>
        </div>

        <!-- Notification element -->
        <div id="notification" class="hidden fixed top-5 left-1/2 -translate-x-1/2 w-11/12 max-w-md z-30 pixel-corners bg-green-500 text-white p-4 text-xl">
             <p></p>
        </div>
    </div>

    <script type="module">
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const connectWalletBtn = document.getElementById('connect-wallet-btn');
        const modalConnectBtn = document.getElementById('modal-connect-btn');
        const welcomeModal = document.getElementById('welcome-modal');
        const walletDetails = document.getElementById('wallet-details');
        const walletAddressSpan = document.getElementById('wallet-address');
        const nodeTierSpan = document.getElementById('node-tier');
        const gameStats = document.getElementById('game-stats');
        const systBalanceSpan = document.getElementById('syst-balance');
        const energyBar = document.getElementById('energy-bar');
        const claimRewardsBtn = document.getElementById('claim-rewards-btn');
        const notification = document.getElementById('notification');

        // --- Game Configuration ---
        const TILE_SIZE_X = 20; // Number of tiles across the width
        const MINE_START_ROW = 4; // Row where the mine ground begins
        const CLICK_COST = 1;
        const CLICKS_PER_DIG = 10;
        const MAX_ENERGY = 100;
        const REWARD_CHANCE = 0.5; // 50% chance to find SYST after a dig
        const LIFT_COLUMN = 2; // Column where the lift is

        const tierConfig = {
            0: { name: "No Node", reward: 0 },
            1: { name: "Tier 1", reward: 0.1 },
            2: { name: "Tier 2", reward: 0.5 },
            3: { name: "Tier 3", reward: 2 },
            4: { name: "Tier 4", reward: 5 },
            5: { name: "Tier 5", reward: 10 },
        };

        // --- Game State ---
        let gameState = {
            connected: false,
            walletAddress: null,
            nodeTier: 0,
            miningEnergy: MAX_ENERGY,
            minedSyst: 0,
            minerPos: { x: 0, y: MINE_START_ROW, dir: 1, animation: 0 },
            minedTiles: {}, // Using an object for efficient lookups { 'x,y': true }
            clickCount: 0,
            isClaiming: false,
        };

        // --- Render State ---
        let camera = { y: 0 };
        let effectiveTileSize = 0;
        let rewardEffects = [];
        let rockPatterns = {};

        // --- Sound Engine ---
        const sounds = {
            mine: new Tone.MetalSynth({ frequency: 50, envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, harmonicity: 3.1, modulationIndex: 16, resonance: 4000, octaves: 1.5 }).toDestination(),
            reward: new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 } }).toDestination(),
            lift: new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.1, decay: 0.5, sustain: 0.1, release: 0.5 } }).toDestination(),
            click: new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(),
        };

        function playSound(type) {
            if (Tone.context.state !== 'running') Tone.start();
            if (sounds[type]) {
                if(type === 'lift') sounds.lift.triggerAttack();
                else sounds[type].triggerAttackRelease(type === 'mine' ? 'C2' : 'G4', '8n');
            }
        }

        // --- Web3 & State Management ---
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') return showNotification("EVM wallet not found. Please use a DApp browser.", 'error');
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const address = accounts[0];
                gameState.walletAddress = address;
                gameState.connected = true;

                // Simulate getNodeTier() call - sticky tier based on address
                const addressSlice = parseInt(address.slice(-4), 16);
                gameState.nodeTier = (addressSlice % 5) + 1; // Tier 1-5

                showNotification(`Mining Node Tier ${gameState.nodeTier} detected!`, 'success');

                loadProgress(); // Load progress for this wallet
                updateUI();

            } catch (err) {
                console.error("Error connecting wallet:", err);
                showNotification("Wallet connection rejected.", 'error');
            }
        }

        function saveProgress() {
            if (!gameState.walletAddress) return;
            const stateToSave = {
                minerPos: gameState.minerPos,
                minedTiles: gameState.minedTiles,
                minedSyst: gameState.minedSyst,
            };
            localStorage.setItem(`syst_miner_save_${gameState.walletAddress}`, JSON.stringify(stateToSave));
        }

        function loadProgress() {
            if (!gameState.walletAddress) return;
            const savedStateJSON = localStorage.getItem(`syst_miner_save_${gameState.walletAddress}`);
            if (savedStateJSON) {
                try {
                    const savedState = JSON.parse(savedStateJSON);
                    gameState.minerPos = savedState.minerPos || { x: 0, y: MINE_START_ROW, dir: 1, animation: 0 };
                    gameState.minedTiles = savedState.minedTiles || {};
                    gameState.minedSyst = savedState.minedSyst || 0;
                    showNotification("Previous progress loaded!", 'info');
                } catch (e) {
                    console.error("Could not parse saved state:", e);
                }
            }
        }

        // --- Core Game Logic ---
        function mine() {
            if (gameState.isClaiming || gameState.miningEnergy <= 0) {
                if (gameState.miningEnergy <= 0) showNotification("Energy depleted! Claim rewards to recharge.", "info");
                return;
            }

            gameState.miningEnergy -= CLICK_COST;
            gameState.clickCount++;
            gameState.minerPos.animation = 5; // For pickaxe swing
            playSound('mine');

            if (gameState.clickCount >= CLICKS_PER_DIG) {
                gameState.clickCount = 0;

                // Break the two rock tiles in front of the miner
                const digX = gameState.minerPos.x + (gameState.minerPos.dir === 1 ? 2 : -1);
                [0, 1].forEach(offsetY => {
                    const tileY = gameState.minerPos.y + offsetY;
                    const tileKey = `${digX},${tileY}`;
                    if (digX >= 0 && digX < TILE_SIZE_X) {
                        gameState.minedTiles[tileKey] = true;
                        // Check for rewards
                        if (Math.random() < REWARD_CHANCE) {
                            const rewardAmount = tierConfig[gameState.nodeTier]?.reward || 0;
                            if (rewardAmount > 0) {
                                gameState.minedSyst += rewardAmount;
                                rewardEffects.push({ x: (digX + 0.5) * effectiveTileSize, y: (tileY + 0.5) * effectiveTileSize, amount: rewardAmount.toFixed(4), life: 60 });
                                playSound('reward');
                            }
                        }
                    }
                });

                // Advance miner
                gameState.minerPos.x += gameState.minerPos.dir;

                // Snake-like movement
                if (gameState.minerPos.dir === 1 && (gameState.minerPos.x + 2 >= TILE_SIZE_X)) {
                    gameState.minerPos.y += 2;
                    gameState.minerPos.dir = -1;
                } else if (gameState.minerPos.dir === -1 && gameState.minerPos.x <= 0) {
                    gameState.minerPos.y += 2;
                    gameState.minerPos.dir = 1;
                }
            }
            updateUI();
            saveProgress();
        }

        async function claimRewards() {
            if (gameState.isClaiming) return;
            if (gameState.minedSyst <= 0 && gameState.miningEnergy > 0) return showNotification("No SYST to claim.", 'info');

            gameState.isClaiming = true;
            claimRewardsBtn.disabled = true;
            playSound('lift');

            const originalPos = { ...gameState.minerPos };
            const liftScreenX = (LIFT_COLUMN + 1) * effectiveTileSize;

            // 1. Animate to lift
            await animateTo(val => gameState.minerPos.x = val, gameState.minerPos.x, LIFT_COLUMN, 1500);

            // 2. Ascend
            await animateTo(val => gameState.minerPos.y = val, gameState.minerPos.y, -5, 2000);

            // 3. Claim on surface
            showNotification("Rewards Claimed! Energy Recharged!", 'success');
            gameState.minedSyst = 0;
            gameState.miningEnergy = MAX_ENERGY;
            updateUI();
            await new Promise(res => setTimeout(res, 1000));
            sounds.lift.triggerRelease(); // Stop sound

            // 4. Descend
            playSound('lift');
            await animateTo(val => gameState.minerPos.y = val, -5, originalPos.y, 2000);

            // 5. Return to position
            await animateTo(val => gameState.minerPos.x = val, LIFT_COLUMN, originalPos.x, 1500);

            gameState.minerPos = originalPos; // Snap to final position
            sounds.lift.triggerRelease();
            gameState.isClaiming = false;
            claimRewardsBtn.disabled = false;
            saveProgress();
        }

        // --- Drawing & Rendering ---

        function gameLoop() {
            // Update camera to follow miner smoothly
            const targetY = (gameState.minerPos.y + 1) * effectiveTileSize - canvas.height / 2;
            camera.y += (targetY - camera.y) * 0.05;
            if (camera.y < 0) camera.y = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(0, -camera.y);

            drawGridAndRocks();
            drawScenery();
            drawLift();
            drawMiner();
            drawEffects();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        const rockColors = ['#4a3f35', '#574a3e', '#3b322a'];
        function getRockPattern(x, y) {
            const key = `${x},${y}`;
            if (!rockPatterns[key]) {
                rockPatterns[key] = Array.from({length: 4}, () => ({ x: Math.random(), y: Math.random(), size: Math.random() * 0.4 + 0.1, color: rockColors[Math.floor(Math.random() * 3)] }));
            }
            return rockPatterns[key];
        }

        function drawScenery() {
            if (!effectiveTileSize) return;
            const landY = MINE_START_ROW * effectiveTileSize;

            ctx.fillStyle = '#60a5fa'; // Sky
            ctx.fillRect(0, 0, canvas.width, landY);
            ctx.fillStyle = '#6b4c2d'; // Ground
            ctx.fillRect(0, landY, canvas.width, effectiveTileSize);

            // Shack
            const shackWidth = effectiveTileSize * 4, shackHeight = effectiveTileSize * 3;
            const shackX = (canvas.width / 2) - (shackWidth / 2), shackY = landY - shackHeight;
            ctx.fillStyle = '#6b4c2d'; ctx.fillRect(shackX, shackY, shackWidth, shackHeight);
            ctx.fillStyle = '#8c5a2b'; ctx.beginPath(); ctx.moveTo(shackX - effectiveTileSize * 0.2, shackY); ctx.lineTo(shackX + shackWidth + effectiveTileSize * 0.2, shackY); ctx.lineTo(shackX + shackWidth, shackY - shackHeight * 0.5); ctx.lineTo(shackX, shackY - shackHeight * 0.5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#4a3f35'; ctx.fillRect(shackX + shackWidth * 0.35, shackY + shackHeight * 0.2, shackWidth * 0.3, shackHeight * 0.8);

            // Mine entrance
            const caveX = (LIFT_COLUMN + 1) * effectiveTileSize;
            ctx.fillStyle = 'black';
            ctx.fillRect(caveX - effectiveTileSize, landY, effectiveTileSize * 2, effectiveTileSize * 2);
        }

        function drawGridAndRocks() {
            if (!effectiveTileSize) return;
            const startY = Math.floor(camera.y / effectiveTileSize);
            const endY = Math.min(startY + Math.ceil(canvas.height / effectiveTileSize) + 2, 1000);

            ctx.fillStyle = '#2d2620'; // Base rock color
            ctx.fillRect(0, MINE_START_ROW * effectiveTileSize, canvas.width, (endY - MINE_START_ROW) * effectiveTileSize);

            for (let y = Math.max(MINE_START_ROW, startY); y < endY; y++) {
                for (let x = 0; x < TILE_SIZE_X; x++) {
                     if (!gameState.minedTiles[`${x},${y}`]) {
                        ctx.fillStyle = rockColors[0];
                        ctx.fillRect(x * effectiveTileSize, y * effectiveTileSize, effectiveTileSize, effectiveTileSize);
                        const pattern = getRockPattern(x, y);
                        pattern.forEach(p => {
                            ctx.fillStyle = p.color;
                            ctx.fillRect((x + p.x) * effectiveTileSize, (y + p.y) * effectiveTileSize, effectiveTileSize * p.size, effectiveTileSize * p.size);
                        });
                        ctx.strokeStyle = '#2d2620';
                        ctx.strokeRect(x * effectiveTileSize, y * effectiveTileSize, effectiveTileSize, effectiveTileSize);
                    }
                }
            }
        }

        function drawLift() {
            if (!effectiveTileSize) return;
            const liftWidth = effectiveTileSize * 2;
            const liftHeight = effectiveTileSize * 2;
            const liftScreenX = LIFT_COLUMN * effectiveTileSize;
            const liftY = gameState.isClaiming ? gameState.minerPos.y * effectiveTileSize : (gameState.minerPos.y + 1) * effectiveTileSize;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(liftScreenX, 0, liftWidth, 1000 * effectiveTileSize);

            ctx.fillStyle = '#8c5a2b';
            ctx.fillRect(liftScreenX, liftY, liftWidth, liftHeight);
        }

        function drawMiner() {
            if (!effectiveTileSize) return;
            const baseSize = effectiveTileSize * 2;
            const cX = (gameState.minerPos.x + 1) * effectiveTileSize;
            const cY = (gameState.minerPos.y + 1) * effectiveTileSize;
            const p = (size) => size / 16 * baseSize;

            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(cX - p(4), cY, p(4), p(6)); // Left leg
            ctx.fillRect(cX, cY, p(4), p(6)); // Right leg
            ctx.fillStyle = '#1d4ed8'; ctx.fillRect(cX - p(5), cY - p(6), p(10), p(8)); // Body
            ctx.fillStyle = '#d2a679'; ctx.fillRect(cX - p(4), cY - p(11), p(8), p(5)); // Head
            ctx.fillStyle = '#4a2e0a'; ctx.fillRect(cX - p(5), cY - p(12), p(10), p(4)); // Hair
            ctx.fillStyle = '#f59e0b'; ctx.fillRect(cX - p(6), cY - p(14), p(12), p(3)); // Helmet light
            ctx.fillStyle = '#60a5fa'; ctx.fillRect(cX - p(2), cY - p(15), p(4), p(2)); // Helmet bulb

            ctx.save();
            ctx.translate(cX, cY - p(2));
            if (gameState.minerPos.animation > 0) {
                const swing = Math.sin((10 - gameState.minerPos.animation) * 0.5) * 1.2;
                ctx.rotate(swing * gameState.minerPos.dir);
                gameState.minerPos.animation--;
            }
            ctx.fillStyle = '#1d4ed8'; ctx.fillRect(p(2) * gameState.minerPos.dir, -p(1), p(5), p(2));
            ctx.fillStyle = '#6b7280'; ctx.fillRect(p(6) * gameState.minerPos.dir, -p(1.5), p(7), p(1));
            ctx.fillStyle = '#d1d5db'; ctx.fillRect(p(12) * gameState.minerPos.dir, -p(3), p(1), p(4));
            ctx.restore();
        }

        function drawEffects() {
            if (!effectiveTileSize) return;
            ctx.fillStyle = '#f59e0b';
            ctx.font = `${effectiveTileSize * 0.8}px VT323`;
            ctx.textAlign = 'center';
            for (let i = rewardEffects.length - 1; i >= 0; i--) {
                const effect = rewardEffects[i];
                ctx.globalAlpha = effect.life / 60;
                ctx.fillText(`+${effect.amount}`, effect.x, effect.y);
                effect.y -= 0.5;
                effect.life--;
                if (effect.life <= 0) rewardEffects.splice(i, 1);
            }
            ctx.globalAlpha = 1;
        }

        // --- UI & Utility Functions ---
        function updateUI() {
            systBalanceSpan.innerText = gameState.minedSyst.toFixed(4);
            energyBar.style.width = `${gameState.miningEnergy}%`;

            if (gameState.connected) {
                welcomeModal.classList.add('hidden');
                connectWalletBtn.classList.add('hidden');
                walletDetails.classList.remove('hidden');
                gameStats.classList.remove('hidden');
                claimRewardsBtn.classList.remove('hidden');
                walletAddressSpan.innerText = `${gameState.walletAddress.substring(0, 6)}...${gameState.walletAddress.substring(gameState.walletAddress.length - 4)}`;
                nodeTierSpan.innerText = tierConfig[gameState.nodeTier].name;
            }
        }

        function showNotification(message, type = 'info') {
             notification.querySelector('p').innerText = message;
             notification.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'bg-blue-500');
             const typeClass = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';
             notification.classList.add(typeClass);
             setTimeout(() => notification.classList.add('hidden'), 3000);
        }

        function lerp(start, end, t) { return start * (1 - t) + end * t; }

        async function animateTo(setter, start, end, duration) {
            let startTime = null;
            return new Promise(resolve => {
                function animationStep(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    setter(lerp(start, end, progress));
                    if (progress < 1) requestAnimationFrame(animationStep);
                    else resolve();
                }
                requestAnimationFrame(animationStep);
            });
        }

        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            effectiveTileSize = canvas.width / TILE_SIZE_X;
            camera.y = (gameState.minerPos.y + 1) * effectiveTileSize - canvas.height / 2;
        }

        // --- Initialization ---
        function init() {
            setupCanvas();

            const handleConnect = () => { playSound('click'); connectWallet(); };
            connectWalletBtn.addEventListener('click', handleConnect);
            modalConnectBtn.addEventListener('click', handleConnect);
            claimRewardsBtn.addEventListener('click', () => { playSound('click'); claimRewards(); });
            canvas.addEventListener('click', mine);

            window.addEventListener('resize', setupCanvas);
            if (window.ethereum) {
                window.ethereum.on('accountsChanged', () => {
                    showNotification("Account changed. Reloading...", 'info');
                    setTimeout(() => window.location.reload(), 2000);
                });
            }

            gameLoop();
        }

        init();
    </script>
</body>
</html>
