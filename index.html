<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SYST Mining Game</title>
    <script src="https://cdn-tailwindcss.vercel.app/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Ethers.js for EVM chains -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        :root {
            --bg-dark: #09051c;
            --blue-dark: #1e3a8a;
            --blue-medium: #1d4ed8;
            --blue-light: #60a5fa;
            --fuchsia: #d946ef;
            --cyan: #22d3ee;
            --amber: #f59e0b;
            --text-light: #e3e3e3;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'VT323', monospace;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #game-container {
            position: relative;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            display: block; /* Ensure it behaves as a block element */
        }

        .pixel-corners {
            background-color: rgba(30, 58, 138, 0.8); /* var(--blue-dark) with opacity */
            border: 4px solid #1e40af;
            backdrop-filter: blur(5px);
        }

        .pixel-btn {
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            border-bottom-width: 4px;
        }
        .pixel-btn:hover { transform: translateY(-2px); }
        .pixel-btn:active { transform: translateY(1px); border-bottom-width: 2px; }
        .pixel-btn:disabled { background-color: #4a5568; border-color: #2d3748; cursor: not-allowed; }

        .modal-overlay {
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="antialiased flex flex-col h-screen bg-black">

    <!-- Top HUD Area -->
    <div id="hud-container" class="flex-shrink-0 p-2 md:p-4 flex justify-between items-start gap-4" style="background-color: var(--bg-dark);">
        <div id="wallet-info" class="pixel-corners p-2 md:p-4 text-base md:text-lg">
            <button id="connect-wallet-btn" class="pixel-btn px-3 py-1 md:px-4 md:py-2 bg-amber-500 text-white border-amber-700">Connect Wallet</button>
            <div id="wallet-details" class="hidden">
                <p>Status: <span class="text-green-400">Connected</span></p>
                <p>Wallet: <span id="wallet-address" class="text-cyan-400"></span></p>
                <p>Node Tier: <span id="node-tier" class="text-fuchsia-400">No Node</span></p>
            </div>
        </div>
        <div id="game-stats" class="pixel-corners p-2 md:p-4 text-base md:text-lg text-right hidden">
            <p>Mined: <span id="syst-balance" class="text-amber-400 text-xl md:text-2xl">0.0</span></p>
            <p class="mt-1 md:mt-2">Energy:</p>
            <div class="w-32 md:w-48 h-5 md:h-6 bg-gray-900 border-2 border-cyan-400 mt-1">
                <div id="energy-bar" class="h-full bg-cyan-400 transition-all duration-300" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div id="game-container" class="relative flex-grow w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>

        <!-- UI OVERLAY for in-game elements -->
        <div id="ui-overlay" class="absolute inset-0 p-4 flex flex-col justify-end items-center pointer-events-none">
             <!-- Bottom UI: Claim Button -->
            <div class="pointer-events-auto">
                 <button id="claim-rewards-btn" class="hidden pixel-btn px-6 py-3 md:px-8 md:py-4 text-xl md:text-2xl bg-fuchsia-500 text-white border-fuchsia-700">Claim Rewards</button>
            </div>
        </div>
    </div>

    <!-- MODAL for initial connection / instructions -->
    <div id="welcome-modal" class="fixed inset-0 modal-overlay z-20 flex items-center justify-center p-4">
        <div class="pixel-corners p-8 max-w-lg text-center">
            <h1 class="text-4xl text-cyan-400 mb-4">SYST Mining Game</h1>
            <p class="text-xl mb-6">Connect your wallet to begin. You must hold a Mining Node NFT to play.</p>
            <button id="modal-connect-btn" class="pixel-btn px-8 py-3 text-2xl bg-amber-500 text-white border-amber-700">Connect Wallet</button>
        </div>
    </div>

    <!-- Notification element -->
    <div id="notification" class="hidden fixed top-20 left-1/2 -translate-x-1/2 w-11/12 max-w-md z-30 pixel-corners bg-green-500 text-white p-4 text-xl">
         <p></p>
    </div>

    <script type="module">
        // --- GAME & UI SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const connectWalletBtn = document.getElementById('connect-wallet-btn');
        const modalConnectBtn = document.getElementById('modal-connect-btn');
        const welcomeModal = document.getElementById('welcome-modal');
        const walletInfo = document.getElementById('wallet-info');
        const walletDetails = document.getElementById('wallet-details');
        const walletAddressSpan = document.getElementById('wallet-address');
        const nodeTierSpan = document.getElementById('node-tier');
        const gameStats = document.getElementById('game-stats');
        const systBalanceSpan = document.getElementById('syst-balance');
        const energyBar = document.getElementById('energy-bar');
        const claimRewardsBtn = document.getElementById('claim-rewards-btn');
        const notification = document.getElementById('notification');

        // --- WEB3 SETUP ---
        let provider, signer, userAddress;
        let userNodeTier = 0;
        let minedSyst = 0;
        let miningEnergy = 100;

        // --- MOCK CONTRACT ADDRESSES ---
        const NFT_CONTRACT_ADDRESS = "0x...YourNFTContractAddress";
        const MINING_CONTRACT_ADDRESS = "0x...YourMiningContractAddress";
        const NFT_CONTRACT_ABI = ["function balanceOf(address owner) view returns (uint256)", "function getNodeTier(address owner) view returns (uint256)"];
        const MINING_CONTRACT_ABI = ["function claimTokens()"];

        // --- SOUND SETUP ---
        const synth = new Tone.Synth().toDestination();
        const metalSynth = new Tone.MetalSynth({ frequency: 50, envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, harmonicity: 3.1, modulationIndex: 16, resonance: 4000, octaves: 1.5 }).toDestination();

        // Pre-initialized components for the lift sound to improve performance and stability
        const liftNoise = new Tone.Noise("brown").toDestination();
        const liftFilter = new Tone.AutoFilter("4n").toDestination();
        liftNoise.connect(liftFilter);

        const soundCooldowns = { mine: false, reward: false, lift: false };
        const soundDurations = { mine: 0.1, reward: 0.1, lift: 0.5 };

        function playSound(type) {
            if (Tone.context.state !== 'running') Tone.start();
            if (soundCooldowns[type]) return; // Sound is on cooldown, prevent playing

            soundCooldowns[type] = true;

            switch (type) {
                case 'mine':
                    metalSynth.triggerAttackRelease("C2", "8n", Tone.now());
                    break;
                case 'reward':
                    synth.triggerAttackRelease("G4", "8n", Tone.now());
                    break;
                case 'lift':
                    liftNoise.start();
                    liftFilter.start();
                    // Schedule the stop event using Tone.Transport for precise timing
                    Tone.Transport.scheduleOnce(() => {
                        liftNoise.stop();
                    }, `+${soundDurations.lift}`);
                    break;
            }

            // Use Tone.Transport to schedule the cooldown reset
            Tone.Transport.scheduleOnce(() => {
                soundCooldowns[type] = false;
            }, `+${soundDurations[type]}`);

            // Ensure the Transport is running
            if (Tone.Transport.state !== "started") {
                Tone.Transport.start();
            }
        }

        // --- WEB3 LOGIC ---
        async function connectWallet() {
            const urlParams = new URLSearchParams(window.location.search); const isTesting = urlParams.get('testing') === 'true'; if (!isTesting && typeof window.ethereum === 'undefined') { return showNotification("EVM wallet not found. Please use a DApp browser.", 'error'); }
            try {
                if (isTesting) { userAddress = '0xTEST_ADDRESS_FOR_AUTOMATION'; } else { provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress(); }

                welcomeModal.classList.add('hidden');
                connectWalletBtn.classList.add('hidden');
                walletDetails.classList.remove('hidden');
                walletAddressSpan.innerText = isTesting ? userAddress : `${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;

                await checkUserNodeStatus();
            } catch (err) {
                console.error("Error connecting wallet:", err);
                showNotification("Wallet connection rejected.", 'error');
            }
        }

        async function checkUserNodeStatus() {
            showNotification("Checking for Mining Node...", 'info');
            await new Promise(resolve => setTimeout(resolve, 1500));
            userNodeTier = Math.floor(Math.random() * 3) + 1;

            if (userNodeTier > 0) {
                nodeTierSpan.innerText = `Tier ${userNodeTier}`;
                gameStats.classList.remove('hidden');
                claimRewardsBtn.classList.remove('hidden');
                showNotification(`Mining Node Tier ${userNodeTier} detected! Starting game.`, 'success');
                loadGameState();
                startGame();
            } else {
                nodeTierSpan.innerText = "No Node Detected";
                showNotification("No Mining Node found in your wallet. You cannot play.", 'error');
            }
        }

        // --- GAME LOGIC & STATE ---
        let gameActive = false;
        let isReturningToShack = false;
        let isDiggingSequence = false;
        let returnState = 'idle';
        let tilesX, effectiveTileSize;
        const MINE_START_ROW = 5; const isTesting = new URLSearchParams(window.location.search).get('testing') === 'true'; // Adjusted for new layout

        let miner = { x: 0, y: MINE_START_ROW, dir: 1, animation: 0 };
        let minedTiles = {}; // Use an object for a sparse grid, which is more memory efficient for a deep mine

        let lift = { x: 2, y: 0, destY: 0 };
        let rewardEffects = [];
        const REWARD_CHANCE = 0.5; // 50% chance as per original GDD
        let camera = { y: 0 };
        let clickCounter = 0;

        const tierConfig = {
            1: { reward: 0.1 },
            2: { reward: 0.5 },
            3: { reward: 2.0 },
            4: { reward: 5.0 },
            5: { reward: 10.0 }
        };

        function setupGrid() {
            const container = document.getElementById('game-container');
            if (!container) return;
            const { width, height } = container.getBoundingClientRect();
            canvas.width = width;
            canvas.height = height;
            tilesX = 20;
            effectiveTileSize = canvas.width / tilesX;
        }

        function saveGameState() {
            if (!userAddress) return;
            const gameState = {
                minerX: miner.x,
                minerY: miner.y,
                mineDirection: miner.dir,
                minedSyst: minedSyst,
                minedTiles: minedTiles // Save the sparse grid
            };
            localStorage.setItem(`syst_miner_progress_${userAddress}`, JSON.stringify(gameState));
        }

        function loadGameState() {
            if (!userAddress) return;
            const savedState = localStorage.getItem(`syst_miner_progress_${userAddress}`);
            if (savedState) {
                const gameState = JSON.parse(savedState);
                miner.x = gameState.minerX || 0;
                miner.y = gameState.minerY >= MINE_START_ROW ? gameState.minerY : MINE_START_ROW;
                miner.dir = gameState.mineDirection || 1;
                minedSyst = gameState.minedSyst || 0;
                minedTiles = gameState.minedTiles || {}; // Load the sparse grid
                updateUI();
            }
        }

        async function handleMineClick() {
            if (!gameActive || isReturningToShack || isDiggingSequence || miningEnergy <= 0) return;

            if (!isTesting) {
                miningEnergy--;
            }
            clickCounter++;
            miner.animation = 5;
            playSound('mine');
            updateUI();

            if (clickCounter >= 10) {
                isDiggingSequence = true;
                clickCounter = 0;

                await new Promise(resolve => setTimeout(resolve, 250));

                const digX = miner.x + (miner.dir === 1 ? 2 : -1);
                [0, 1].forEach(offsetY => {
                    const tile = { x: digX, y: miner.y + offsetY };
                    const tileKey = `${tile.x},${tile.y}`;

                    if (tile.x >= 0 && tile.x < tilesX && !minedTiles[tileKey]) {
                        minedTiles[tileKey] = true; // Mark tile as mined
                        if (isTesting || Math.random() < REWARD_CHANCE) {
                            const reward = tierConfig[userNodeTier]?.reward || 0.01;
                            minedSyst += reward;
                            rewardEffects.push({ x: (tile.x + 0.5) * effectiveTileSize, y: (tile.y + 0.5) * effectiveTileSize, amount: reward.toFixed(4), life: 60 });
                            playSound('reward');
                        }
                    }
                });

                miner.x += miner.dir;

                // Snake-like movement logic
                if (miner.dir === 1 && (miner.x + 2 >= tilesX)) { miner.y += 2; miner.dir = -1; }
                else if (miner.dir === -1 && (miner.x <= 0)) { miner.y += 2; miner.dir = 1; }

                updateUI();
                saveGameState();
                isDiggingSequence = false;
            }

            if (miningEnergy <= 0) {
                showNotification("Energy depleted! Return to shack to claim and recharge.", "info");
            }
        }


        const rockColors = ['#4a3f35', '#574a3e', '#3b322a'];
        let rockPatterns = {};
        function getRockPattern(x, y) {
            const key = `${x},${y}`;
            if (!rockPatterns[key]) {
                rockPatterns[key] = Array.from({length: 4}, () => ({ x: Math.random(), y: Math.random(), size: Math.random() * 0.4 + 0.1, color: rockColors[Math.floor(Math.random() * 3)] }));
            }
            return rockPatterns[key];
        }

        function drawScenery() {
            if (!effectiveTileSize) return;
            const landY = MINE_START_ROW * effectiveTileSize;

            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(0, 0, canvas.width, landY);
            ctx.fillStyle = '#6b4c2d';
            ctx.fillRect(0, landY, canvas.width, effectiveTileSize);

            const shackWidth = effectiveTileSize * 4, shackHeight = effectiveTileSize * 3;
            const shackX = (canvas.width / 2) - (shackWidth / 2), shackY = landY - shackHeight;
            ctx.fillStyle = '#6b4c2d'; ctx.fillRect(shackX, shackY, shackWidth, shackHeight);
            ctx.fillStyle = '#8c5a2b'; ctx.beginPath(); ctx.moveTo(shackX - effectiveTileSize * 0.2, shackY); ctx.lineTo(shackX + shackWidth + effectiveTileSize * 0.2, shackY); ctx.lineTo(shackX + shackWidth, shackY - shackHeight * 0.5); ctx.lineTo(shackX, shackY - shackHeight * 0.5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#4a3f35'; ctx.fillRect(shackX + shackWidth * 0.35, shackY + shackHeight * 0.2, shackWidth * 0.3, shackHeight * 0.8);

            const caveX = effectiveTileSize * 4;
            const caveRadius = effectiveTileSize * 2;
            ctx.fillStyle = '#57534e'; // Rock color
            ctx.beginPath(); ctx.arc(caveX, landY, caveRadius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(caveX, landY, caveRadius * 0.7, 0, Math.PI * 2); ctx.fill();
        }

        function drawGridAndRocks() {
            if (!effectiveTileSize) return;
            const startY = Math.floor(camera.y / effectiveTileSize);
            const endY = startY + Math.ceil(canvas.height / effectiveTileSize) + 2;

            ctx.fillStyle = '#2d2620'; // Base rock color for the entire mine area visible
            ctx.fillRect(0, MINE_START_ROW * effectiveTileSize, canvas.width, (endY - MINE_START_ROW + 5) * effectiveTileSize);

            for (let y = Math.max(MINE_START_ROW, startY); y < endY; y++) {
                for (let x = 0; x < tilesX; x++) {
                     // If a tile is NOT in minedTiles, it's a rock.
                     if (!minedTiles[`${x},${y}`]) {
                        ctx.fillStyle = rockColors[0];
                        ctx.fillRect(x * effectiveTileSize, y * effectiveTileSize, effectiveTileSize, effectiveTileSize);
                        const pattern = getRockPattern(x, y);
                        pattern.forEach(p => {
                            ctx.fillStyle = p.color;
                            ctx.fillRect((x + p.x) * effectiveTileSize, (y + p.y) * effectiveTileSize, effectiveTileSize * p.size, effectiveTileSize * p.size);
                        });
                        ctx.strokeStyle = '#2d2620';
                        ctx.strokeRect(x * effectiveTileSize, y * effectiveTileSize, effectiveTileSize, effectiveTileSize);
                    }
                }
            }
        }

        function drawLift() {
            if (!effectiveTileSize) return;
            const liftWidth = effectiveTileSize * 2;
            const liftHeight = effectiveTileSize * 2;
            const liftScreenX = lift.x * effectiveTileSize;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            // Draw the lift shaft far down the screen to simulate endlessness
            ctx.fillRect(liftScreenX, 0, liftWidth, canvas.height + camera.y + 2000);

            ctx.fillStyle = '#8c5a2b';
            ctx.fillRect(liftScreenX, lift.y, liftWidth, liftHeight);
            ctx.fillStyle = '#6b4c2d';
            ctx.fillRect(liftScreenX, lift.y + liftHeight - 5, liftWidth, 5);
        }

        function drawMiner() {
            if (!effectiveTileSize) return;
            const baseSize = effectiveTileSize * 2;
            const cX = (miner.x + 1) * effectiveTileSize;
            const cY = (miner.y + 1) * effectiveTileSize;
            const p = (size) => size / 16 * baseSize;

            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(cX - p(4), cY, p(4), p(6));
            ctx.fillRect(cX, cY, p(4), p(6));
            ctx.fillStyle = '#1d4ed8'; ctx.fillRect(cX - p(5), cY - p(6), p(10), p(8));
            ctx.fillStyle = '#d2a679'; ctx.fillRect(cX - p(4), cY - p(11), p(8), p(5));
            ctx.fillStyle = '#4a2e0a'; ctx.fillRect(cX - p(5), cY - p(12), p(10), p(4));
            ctx.fillRect(cX - p(4), cY - p(7), p(8), p(3)); ctx.fillRect(cX - p(2), cY - p(4), p(4), p(2));
            ctx.fillStyle = '#f59e0b'; ctx.fillRect(cX - p(6), cY - p(14), p(12), p(3));
            ctx.fillStyle = '#60a5fa'; ctx.fillRect(cX - p(2), cY - p(15), p(4), p(2));

            ctx.save();
            ctx.translate(cX, cY - p(2));
            if (miner.animation > 0) {
                const swing = Math.sin((10 - miner.animation) * 0.5) * 1.2;
                ctx.rotate(swing * miner.dir);
                miner.animation--;
            }
            ctx.fillStyle = '#1d4ed8'; ctx.fillRect(p(2) * miner.dir, -p(1), p(5), p(2));
            ctx.fillStyle = '#6b7280'; ctx.fillRect(p(6) * miner.dir, -p(1.5), p(7), p(1));
            ctx.fillStyle = '#d1d5db'; ctx.fillRect(p(12) * miner.dir, -p(3), p(1), p(4));
            ctx.restore();
        }

        function drawEffects() {
            if (!effectiveTileSize) return;
            ctx.fillStyle = '#f59e0b';
            ctx.font = `${effectiveTileSize * 0.6}px VT323`;
            ctx.textAlign = 'center';
            for (let i = rewardEffects.length - 1; i >= 0; i--) {
                const effect = rewardEffects[i];
                ctx.globalAlpha = effect.life / 60;
                ctx.fillText(`+${effect.amount} SYST`, effect.x, effect.y);
                effect.y -= 0.5;
                effect.life--;
                if (effect.life <= 0) rewardEffects.splice(i, 1);
            }
            ctx.globalAlpha = 1;
        }

        function updateUI() {
            systBalanceSpan.innerText = minedSyst.toFixed(4);
            energyBar.style.width = `${miningEnergy}%`;
        }

        function showNotification(message, type = 'info') {
             notification.querySelector('p').innerText = message;
             notification.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'bg-blue-500');
             const typeClass = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';
             notification.classList.add(typeClass);
             setTimeout(() => notification.classList.add('hidden'), 4000);
        }

        async function handleClaimSequence() {
            const liftTargetX = lift.x * effectiveTileSize;
            const minerScreenX = miner.x * effectiveTileSize;
            const shackX = (canvas.width / 2) - (effectiveTileSize); // Center of the miner
            const step = 3.75; // A fixed pixel step for movement ensures the animation always finishes

            switch(returnState) {
                case 'goToLift':
                    if (Math.abs(minerScreenX - liftTargetX) > step) {
                        miner.x -= Math.sign(minerScreenX - liftTargetX) * (step / effectiveTileSize);
                    } else {
                        miner.x = lift.x; // Snap to final position
                        returnState = 'ascending';
                        lift.destY = (MINE_START_ROW - 1) * effectiveTileSize;
                        playSound('lift');
                    }
                    break;
                case 'ascending':
                    if (Math.abs(lift.y - lift.destY) > step) {
                        lift.y -= (lift.y - lift.destY) * 0.05; // Proportional is ok for vertical movement
                    } else {
                        lift.y = lift.destY; // Snap
                        returnState = 'goToShack';
                    }
                    miner.y = (lift.y / effectiveTileSize) - 1;
                    break;
                case 'goToShack':
                     if (Math.abs(minerScreenX - shackX) > step) {
                        miner.x += Math.sign(shackX - minerScreenX) * (step / effectiveTileSize);
                     } else {
                        miner.x = shackX / effectiveTileSize; // Snap
                        returnState = 'claiming';
                        showNotification("Claiming rewards...", 'info');
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        minedSyst = 0;
                        miningEnergy = 100;
                        updateUI();
                        saveGameState();
                        showNotification("Rewards Claimed & Energy Recharged!", 'success');
                        returnState = 'backToLift';
                    }
                    break;
                 case 'backToLift':
                    if (Math.abs(minerScreenX - liftTargetX) > step) {
                        miner.x -= Math.sign(minerScreenX - liftTargetX) * (step / effectiveTileSize);
                    } else {
                        miner.x = lift.x; // Snap
                        returnState = 'descending';
                        lift.destY = (gameStateBeforeReturn.y + 1) * effectiveTileSize;
                        playSound('lift');
                    }
                    break;
                case 'descending':
                     if (Math.abs(lift.y - lift.destY) > 1) {
                        lift.y += (lift.destY - lift.y) * 0.05;
                        miner.y = (lift.y / effectiveTileSize) - 1;
                     } else {
                        // Animation finished, snap to final position and reset state
                        lift.y = lift.destY;
                        miner.x = gameStateBeforeReturn.x;
                        miner.y = gameStateBeforeReturn.y;
                        miner.dir = gameStateBeforeReturn.dir;
                        returnState = 'idle';
                        isReturningToShack = false;
                        claimRewardsBtn.disabled = false;
                        claimRewardsBtn.classList.remove('hidden');
                    }
                    break;
            }
        }

        let gameStateBeforeReturn = {};
        function startClaimSequence() {
            if (minedSyst <= 0 && miningEnergy > 0) return showNotification("No SYST to claim.", 'info');
            if (isReturningToShack) return;

            isReturningToShack = true;
            returnState = 'goToLift';
            gameStateBeforeReturn = { x: miner.x, y: miner.y, dir: miner.dir };
            lift.y = (miner.y + 1) * effectiveTileSize;
            claimRewardsBtn.disabled = true;
            claimRewardsBtn.classList.add('hidden');
        }

        function gameLoop() {
            if (isReturningToShack) {
                handleClaimSequence();
            }

            // Camera follows the miner, keeping them vertically centered, but clamped at the top.
            const targetY = (miner.y + 1) * effectiveTileSize - (canvas.height / 2);
            const newCameraY = camera.y + (targetY - camera.y) * 0.1; // Increased easing for more responsive follow
            camera.y = Math.max(0, newCameraY);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(0, -camera.y);

            drawGridAndRocks();
            drawScenery();
            drawLift();
            drawMiner();
            drawEffects();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameActive) return;
            gameActive = true;
        }

        function init() {
            setupGrid();
            // Initial camera position
            camera.y = 0;


            connectWalletBtn.addEventListener('click', connectWallet);
            modalConnectBtn.addEventListener('click', connectWallet);
            claimRewardsBtn.addEventListener('click', startClaimSequence);
            canvas.addEventListener('click', handleMineClick);

            window.addEventListener('resize', () => {
                setupGrid();
            });

            gameLoop();
        }

        init();
    </script>
</body>
</html>
